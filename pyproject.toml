[project]
name = "nacho-moderator"
version = "0.2.0"
description = "An asyncio Telegram admin/moderator bot built with aiogram"
readme = "README.md"
authors = [{ name = "cuwayo", email = "cuwayo@localhost" }]
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-or-later"
dependencies = [
    "aiogram==3.31.0",
    "aiosqlite==0.22.1",
    "regex==2026.9.29",
]

[project.scripts]
nacho-moderator = "nacho_moderator.main:main"

[project.urls]
Repository = "https://github.com/cuwayo/nacho-moderation"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis==6.169.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-randomly==5.0.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pdoc==16.0.0",
    "detect-secrets==1.5.0",
    "pre-commit==4.6.2",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "D",     # pydocstyle (Google convention)
    "ANN",   # flake8-annotations
    "PT",    # flake8-pytest-style
    "PL",    # pylint
    "PERF",  # perflint
    "TRY",   # tryceratops
    "ARG",   # flake8-unused-arguments
    "ERA",   # eradicate (commented-out code)
    "T20",   # flake8-print
    "LOG",   # flake8-logging
    "G",     # flake8-logging-format
    "PTH",   # flake8-use-pathlib
    "FBT",   # flake8-boolean-trap
]
# Each ignore below is deliberate and justified inline.
ignore = [
    "S101",     # asserts are fine in tests and for internal invariants
    "ANN401",   # Any is deliberate at the aiogram/pydantic and test-double seams
    "D107",     # __init__ is documented on the class, not repeated
    "D203",     # conflicts with D211 (blank line before class docstring)
    "D213",     # conflicts with D212 (multi-line summary placement)
    "PLR2004",  # magic values in comparisons are clearer inline than as constants
    "PLC0415",  # lazy imports break circular imports (registry <-> handlers)
    "PLR0913",  # handlers legitimately take many keyword arguments
    "PLR0917",  # ... and many positional/keyword parameters
    "PLR0912",  # a few dispatch functions have many branches by design
    "PLR0911",  # ... and early returns
    "TRY003",   # long, specific error messages are intentional
    "TRY301",   # raising inside try for validation is clearer than splitting
    "FBT001",   # boolean positional params are fine on private/internal helpers
    "T201",     # print is the CLI's user-facing output (and the mock server)
    "ARG001",   # unused args satisfy callback/middleware interfaces
    "ARG002",   # ... likewise on methods
    "D105",     # magic methods are self-documenting
]

[tool.ruff.lint.per-file-ignores]
# Tests: security and docstring rules do not apply to test functions.
"tests/**" = ["S", "SLF001", "E501", "D", "ANN", "PT018", "G"]
# The mock server and scripts are standalone tools, not the package API.
"scripts/**" = ["D", "T201", "ANN"]
"tests/mock/**" = ["D", "T201", "ANN", "PTH"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["nacho_moderator"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_untyped_decorators = false
files = ["src", "tests", "scripts"]
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["aiogram.*", "regex"]
ignore_missing_imports = true

# The scripts are standalone tools with a looser typing budget than the package.
[[tool.mypy.overrides]]
module = ["soak_check", "check_coverage"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = true

# Tests build fake objects that deliberately do not satisfy the real protocols.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Pin the fixture loop scope so pytest-asyncio does not warn (which -W error
# would turn into an error under the asyncio-debug CI run).
asyncio_default_fixture_loop_scope = "function"
# Run every async test on one loop for the whole session. Production runs a
# single long-lived loop (`asyncio.run`), and a per-test loop close races
# aiosqlite's worker thread, which then calls `call_soon_threadsafe` on the
# closed loop and raises an unhandled-thread warning.
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
filterwarnings = ["error"]
# A hung test must fail rather than stall CI (P7).
timeout = 30
timeout_method = "thread"

[tool.coverage.run]
source = ["nacho_moderator"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
