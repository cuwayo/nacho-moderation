name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly soak

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: uv lock is in sync
        run: uv lock --check
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format check)
        run: uv run ruff format --check .

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: mypy (strict, src and tests)
        run: uv run mypy

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --python ${{ matrix.python }}
      - name: pytest (asyncio debug, warnings as errors)
        run: |
          PYTHONASYNCIODEBUG=1 uv run python -X dev -W error -m pytest -q

  coverage:
    name: coverage (global 90% + per-module floors)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: pytest with coverage (global floor 90%)
        run: uv run pytest --cov --cov-branch --cov-report=xml --cov-report=json --cov-report=term
      - name: per-module coverage floors
        run: uv run python scripts/check_coverage.py coverage.json
      - name: Upload coverage artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  security:
    name: security (pip-audit, secrets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: pip-audit (fail on known vulnerabilities)
        run: |
          # The local package is not on PyPI; audit the installed third-party
          # dependencies. --skip-editable is implied by the project not being
          # published, so we exclude it explicitly.
          uv run --with pip-audit pip-audit --skip-editable
      - name: detect-secrets
        run: |
          uv run --with detect-secrets detect-secrets scan --all-files \
            --exclude-files '\.secrets\.baseline$' > /tmp/secrets.json
          uv run --with detect-secrets detect-secrets-hook --baseline .secrets.baseline

  docs-lint:
    name: docs-lint (markdownlint, lychee)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: lychee (internal links)
        uses: lycheeverse/lychee-action@1d97d84f0bc547f7b25f4c2170d87d810dc2fb2c # v2.4.0
        with:
          args: --offline --no-progress "README.md" "docs/**/*.md"
          fail: true

  docs-smoke:
    name: docs-smoke (README quick-start)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Extract and run README quick-start (title="ci") snippets
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/quickstart.sh
          import re, pathlib
          text = pathlib.Path("README.md").read_text(encoding="utf-8")
          for m in re.finditer(r"```[^\n]*title=\"ci\"\n(.*?)^```", text, re.M | re.S):
              print(m.group(1))
          PY
          bash /tmp/quickstart.sh

  docs-consistency:
    name: docs-consistency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: docs-consistency (command registry, config keys, links, tables)
        env:
          # The CHANGELOG check compares against the PR base branch.
          CI_BASE_REF: ${{ github.base_ref }}
          SKIP_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') && '1' || '0' }}
        run: uv run pytest tests/test_docs_consistency.py -q

  docs-build:
    name: docs-build (pdoc API reference)
    runs-on: ubuntu-24.04
    # Publish to GitHub Pages only from main or a tag; still build on PRs.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Build the API reference (fails on warnings)
        run: |
          set -o pipefail
          uv run pdoc nacho_moderator -o build/docs 2>&1 | tee /tmp/pdoc.log
          ! grep -i "warning\|error" /tmp/pdoc.log
      - name: Upload the API reference
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: api-docs
          path: build/docs
          if-no-files-found: error
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload the Pages artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  soak-smoke:
    name: soak-smoke (30s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Soak smoke (30 s @ 1000/s, production flags; full timing gate)
        run: bash scripts/run_soak.sh smoke
      - name: Soak hygiene (asyncio debug; tracebacks, un-awaited, resources)
        run: bash scripts/run_soak.sh hygiene

  nightly-soak:
    name: nightly-soak (10 min)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@4db96194c378173c656ce18a155ffc14a9fc4355 # v5.2.2
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Soak (nightly)
        run: bash scripts/run_soak.sh nightly --seconds 600 --rate 1000
