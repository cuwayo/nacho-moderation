name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: "17 3 * * *" # nightly soak

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format check)
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy src

  test:
    name: test (${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --python ${{ matrix.python }}
      - name: pytest
        run: uv run pytest -q

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: pytest with coverage (floor 85%)
        run: uv run pytest --cov --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: warn

  docs-lint:
    name: docs-lint (markdownlint, lychee)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: lychee (internal links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "README.md" "docs/**/*.md"
          fail: true

  docs-smoke:
    name: docs-smoke (README quick-start)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Extract and run README quick-start (title="ci") snippets
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/quickstart.sh
          import re, pathlib
          text = pathlib.Path("README.md").read_text(encoding="utf-8")
          for m in re.finditer(r"```[^\n]*title=\"ci\"\n(.*?)^```", text, re.M | re.S):
              print(m.group(1))
          PY
          bash /tmp/quickstart.sh

  soak-smoke:
    name: soak-smoke (30s)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Soak smoke (30 s, asyncio debug)
        run: bash scripts/run_soak.sh smoke

  nightly-soak:
    name: nightly-soak (10 min)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups
      - name: Soak (nightly)
        run: bash scripts/run_soak.sh nightly --seconds 600 --rate 1000
