# nacho-moderator configuration sample.
# Copy to config.toml and edit. Precedence: CLI flag > environment variable >
# this file > built-in default.

# Telegram bot token issued by BotFather (required, never logged).
bot_token = "123456:REPLACE_ME"

# Update source: "polling" or "webhook".
mode = "polling"

# Comma-separated Telegram user ids granted bot-level sudo.
sudo_ids = ""

[webhook]

# Webhook listen address behind a TLS-terminating reverse proxy.
listen = "127.0.0.1:8080"

# X-Telegram-Bot-Api-Secret-Token value verified on inbound webhook requests.
# Required (at least 16 characters) in webhook mode. Generate with
# `openssl rand -hex 32`.
secret = "REPLACE_ME_WITH_A_LONG_RANDOM_SECRET"

[db]

# SQLite database file path.
path = "./bot.db"

[api]

# Number of keep-alive connections to the Bot API.
pool_size = 4

# Bot API base URL; a plain http:// base skips TLS for local or self-hosted
# deployments and for the test mock server.
base = "https://api.telegram.org"

# Per-request deadline for Bot API calls, in milliseconds.
request_timeout_ms = 15000

[polling]

# getUpdates long-poll timeout, in seconds.
timeout = 30

[log]

# Log verbosity: error, warn, info or debug.
level = "info"
