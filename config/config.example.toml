# nacho-moderator configuration sample
# Generated by `tgbot --dump-config-example`; do not edit by hand.
# Copy to config.toml and edit. Precedence: CLI flag > environment
# variable > this file > built-in default.

# Telegram bot token issued by BotFather (required)
# env: BOT_TOKEN
bot_token = "123456:REPLACE_ME"

# Update source: polling or webhook
# env: MODE
mode = "polling"

# Comma-separated Telegram user ids granted bot-level sudo
# env: SUDO_IDS
sudo_ids = ""

[webhook]

# Webhook listen address behind a TLS-terminating reverse proxy
# env: WEBHOOK_LISTEN
listen = "127.0.0.1:8080"

# X-Telegram-Bot-Api-Secret-Token value verified on inbound webhook requests
# env: WEBHOOK_SECRET
secret = "REPLACE_ME"

[db]

# SQLite database file path
# env: DB_PATH
path = "./bot.db"

[api]

# Number of keep-alive TLS connections to the Bot API
# env: API_POOL_SIZE
pool_size = 4

# Bot API base URL; a plain http:// base skips TLS for local or self-hosted deployments
# env: API_BASE
base = "https://api.telegram.org"

# Per-request deadline for Bot API calls in milliseconds
# env: API_REQUEST_TIMEOUT_MS
request_timeout_ms = 15000

[polling]

# getUpdates long-poll timeout in seconds
# env: POLLING_TIMEOUT
timeout = 30

[log]

# Log verbosity: error, warn, info or debug
# env: LOG_LEVEL
level = "info"

